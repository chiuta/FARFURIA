<style>
:root{color-scheme:light dark;--bg:#f6f4ec;--card:#ffffff;--ink:#1d2a23;--mut:#55655b;--acc:#2c7a4b;--onacc:#ffffff;--acc2:#e6f2ea;--warn:#8f5a08;--warn2:#fdf1dc;--bad:#b3392c;--line:#d5ddd5;--c1:#2c7a4b;--c2:#c98a14;--c3:#3b6fa5;--r:14px;--gap:14px;--navh:62px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111815;--card:#1a2420;--ink:#e7eee9;--mut:#a4b6aa;--acc:#5fc08a;--onacc:#08130d;--acc2:#21332a;--warn:#e3ab4f;--warn2:#3a2e17;--bad:#ef8174;--line:#2d3d34;--c1:#5fc08a;--c2:#e3ab4f;--c3:#7fb0e0}}
:root[data-theme=dark]{color-scheme:dark;--bg:#111815;--card:#1a2420;--ink:#e7eee9;--mut:#a4b6aa;--acc:#5fc08a;--onacc:#08130d;--acc2:#21332a;--warn:#e3ab4f;--warn2:#3a2e17;--bad:#ef8174;--line:#2d3d34;--c1:#5fc08a;--c2:#e3ab4f;--c3:#7fb0e0}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;width:36px;height:36px}
h1{margin:0;font-size:1.2rem;letter-spacing:.12em;line-height:1.1}
#sub{display:none;margin:2px 0 0;font-size:.8rem;color:var(--mut);line-height:1.3;max-width:62ch}
.tools{display:flex;gap:6px;flex:none}
.tools select{max-width:132px}
#theme{min-width:44px;padding:8px;line-height:0}
select,input[type=number],input[type=date],input[type=text]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%;min-height:44px}
input[type=date]{min-width:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;min-height:44px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--c3);outline-offset:2px}
button:active{transform:translateY(1px)}
/* navigation: bottom bar on phones, pills from 700px */
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--navh);border:0;border-radius:0;background:none;color:var(--mut);padding:6px 2px;font-size:.68rem;line-height:1.15;min-width:0}
nav#tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav#tabs button.on{color:var(--acc);font-weight:600;box-shadow:inset 0 3px 0 var(--acc)}
nav#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{padding:16px 0 24px}
footer{padding:8px 0 calc(var(--navh) + 28px + env(safe-area-inset-bottom));font-size:.8rem;color:var(--mut);text-align:center}
footer a{color:var(--acc);display:inline-flex;align-items:center;min-height:44px;padding:0 8px}
a{color:var(--acc)}
/* layout */
.cols2{display:grid;gap:var(--gap);align-items:start;grid-template-columns:minmax(0,1fr)}
.cols2>*{min-width:0}
.cols2>.card,.cols2>section{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 var(--gap)}
.card h2{margin:0 0 10px;font-size:1.05rem}
.card.warn{background:var(--warn2);border-color:var(--warn)}
.note{background:var(--warn2);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:.92rem}
.note div+div{margin-top:4px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--mut);min-width:0}
.fld select,.fld input{color:var(--ink);font-size:1rem;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--card);cursor:pointer;font-size:.92rem;color:var(--ink);min-height:44px}
.chip input{accent-color:var(--acc);width:20px;height:20px;margin:0;flex:none}
.chip:has(input:checked){background:var(--acc2);border-color:var(--acc)}
.chip:has(input:focus-visible){outline:3px solid var(--c3);outline-offset:2px}
.mut{color:var(--mut)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--acc2)}
.big{font-size:2.6rem;font-weight:700;line-height:1;color:var(--acc)}
.big small{font-size:1rem;font-weight:500;margin-left:6px;color:var(--mut)}
.metrics{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.metric{border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.metric b{display:block;font-size:1.25rem}
.metric span{font-size:.8rem;color:var(--mut)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:8px 0}
.stack i{display:block;height:100%}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.9rem}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--cc)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--warn2);color:var(--warn);border:1px solid var(--warn);margin-left:6px;vertical-align:middle}
ul.tips{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.tips li{display:flex;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;min-width:0}
.ti{flex:none;width:34px;height:34px;border-radius:50%;background:var(--acc2);display:grid;place-items:center;font-size:1.1rem}
ul.tips p{margin:0 0 6px}
.src{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--acc);text-decoration:none;background:var(--card);display:inline-flex;align-items:center;min-height:30px}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:var(--gap);padding-bottom:2px;scroll-snap-type:x proximity}
.days button{flex:1 0 auto;scroll-snap-align:start;min-width:52px}
.days button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.day:not(.on){display:none}
.meals{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));margin-bottom:var(--gap)}
.meal{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);min-width:0}
.meal h3{margin:0 0 4px;font-size:.98rem;display:flex;justify-content:space-between;gap:8px}
.meal ul{margin:4px 0;padding-left:18px}
.macs{font-size:.8rem;color:var(--mut)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar i.over{background:var(--c2)}
.prow{display:grid;grid-template-columns:90px 1fr 130px;gap:8px;align-items:center;margin:8px 0;font-size:.9rem}
.prow>:last-child{text-align:right}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.row.sb{justify-content:space-between}
.fl{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fl>div{min-width:0}
.fl small{color:var(--mut);display:block}
.fl button{flex:none;min-width:44px;padding:8px}
#flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));column-gap:24px}
.x{border:none;background:none;color:var(--bad);font-size:1.3rem;padding:2px 10px}
.wlist{display:flex;align-items:center;gap:14px}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);padding:0;width:min(560px,94vw);max-width:none;max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dbody{padding:18px}
#toast{position:fixed;left:50%;bottom:calc(var(--navh) + 14px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sc{border-top:1px solid var(--line);padding:12px 0}
.sc:first-of-type{border-top:none}
.sc a{display:inline-flex;align-items:center;min-height:36px}
.rt td:first-child{white-space:nowrap}
@media(max-width:639px){
  .rt thead{display:none}
  .rt tr{display:block;padding:8px 0;border-bottom:1px solid var(--line)}
  .rt td{display:block;border:none;padding:2px 0;white-space:normal!important}
  .prow{grid-template-columns:1fr auto;gap:4px 8px}
  .prow>:nth-child(2){grid-column:1/-1;grid-row:2}
  .prow>:nth-child(3){grid-column:2;grid-row:1}
  .big{font-size:2.2rem}
  dialog{margin:auto auto 0;width:100%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
}
@media(min-width:700px){
  :root{--gap:16px}
  #sub{display:block}
  .brand svg{width:42px;height:42px}
  h1{font-size:1.35rem}
  nav#tabs{position:static;display:flex;gap:6px;border:0;background:none;padding:0 0 10px;overflow-x:auto}
  nav#tabs button{flex-direction:row;min-height:42px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);padding:6px 16px;font-size:.95rem;gap:8px;white-space:nowrap;flex:none}
  nav#tabs button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc);box-shadow:none;font-weight:600}
  nav#tabs svg{width:18px;height:18px}
  nav#tabs button span{overflow:visible}
  main{padding:20px 0 32px}
  footer{padding-bottom:40px}
  .card{padding:20px}
  #toast{bottom:24px}
}
@media(min-width:760px){
  .cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols2>.span2{grid-column:1/-1}
}
@media(min-width:1000px){
  ul.tips{grid-template-columns:1fr 1fr}
  .big{font-size:3rem}
}
@media(max-height:480px) and (orientation:landscape){
  :root{--navh:50px}
  nav#tabs button{flex-direction:row;gap:6px;font-size:.72rem}
  nav#tabs svg{width:18px;height:18px}
}
@media print{
  header.top,nav,footer,.noprint,dialog,#toast{display:none!important}
  body{background:#fff;color:#000}
  .card,.meal{border-color:#999;break-inside:avoid}
  .day{display:block!important;break-after:page}
  .cols2{display:block}
}
</style>

A('lock_minor',"Aplicația este pentru adulți (18+). La copii și adolescenți, necesarul se stabilește de un medic pediatru sau dietetician, după curbele de creștere.","This app is for adults (18+). For children and teenagers, needs must be set by a paediatrician or dietitian using growth charts.","Cette application est destinée aux adultes (18+). Pour les enfants et adolescents, les besoins doivent être fixés par un pédiatre ou un diététicien à l’aide des courbes de croissance.","Questa app è per adulti (18+). Per bambini e adolescenti i fabbisogni vanno stabiliti da un pediatra o da un dietista sulla base delle curve di crescita.","Esta aplicación es para adultos (18+). En niños y adolescentes, las necesidades las fija un pediatra o dietista según las curvas de crecimiento.","Esta aplicação destina-se a adultos (18+). Em crianças e adolescentes, as necessidades devem ser definidas por um pediatra ou dietista com base nas curvas de crescimento.","Diese App ist für Erwachsene (18+). Bei Kindern und Jugendlichen legt ein Kinderarzt oder Ernährungsberater den Bedarf anhand von Wachstumskurven fest.","Ez az alkalmazás felnőtteknek (18+) szól. Gyermekeknél és serdülőknél az igényt gyermekorvos vagy dietetikus határozza meg a növekedési görbék alapján.");
A('lock_ed',"Pentru siguranța ta, aplicația nu afișează ținte calorice, planuri de mese sau jurnal de calorii. Un medic, un dietetician clinician sau un psiholog specializat te poate sprijini cu un plan potrivit.","For your safety, the app does not show calorie targets, meal plans or a calorie diary. A doctor, a clinical dietitian or a specialised psychologist can support you with a suitable plan.","Pour votre sécurité, l’application n’affiche ni objectifs caloriques, ni plans de repas, ni journal calorique. Un médecin, un diététicien clinicien ou un psychologue spécialisé peut vous accompagner avec un plan adapté.","Per la tua sicurezza l’app non mostra obiettivi calorici, piani pasti né diario calorico. Un medico, un dietista clinico o uno psicologo specializzato può aiutarti con un piano adatto.","Por tu seguridad, la aplicación no muestra objetivos calóricos, planes de comidas ni diario calórico. Un médico, un dietista clínico o un psicólogo especializado puede ayudarte con un plan adecuado.","Para sua segurança, a aplicação não mostra metas calóricas, planos de refeições nem diário calórico. Um médico, um dietista clínico ou um psicólogo especializado pode apoiá-lo com um plano adequado.","Zu deiner Sicherheit zeigt die App keine Kalorienziele, Speisepläne oder Kalorientagebücher an. Ärzt:innen, klinische Ernährungsberater:innen oder spezialisierte Psycholog:innen können dich mit einem passenden Plan unterstützen.","A biztonságod érdekében az alkalmazás nem mutat kalóriacélt, étrendet vagy kalórianaplót. Orvos, klinikai dietetikus vagy szakpszichológus megfelelő tervvel segíthet.");
A('lock_ckd',"În boala renală cronică, proteinele, potasiul, fosforul și lichidele trebuie individualizate. Aplicația nu calculează ținte pentru tine — cere planul unui nefrolog sau dietetician clinician.","In chronic kidney disease, protein, potassium, phosphorus and fluids must be individualised. The app does not calculate targets for you — ask a nephrologist or clinical dietitian for a plan.","Dans la maladie rénale chronique, protéines, potassium, phosphore et liquides doivent être individualisés. L’application ne calcule pas d’objectifs pour vous — demandez un plan à un néphrologue ou à un diététicien clinicien.","Nella malattia renale cronica proteine, potassio, fosforo e liquidi vanno personalizzati. L’app non calcola obiettivi per te: chiedi un piano a un nefrologo o a un dietista clinico.","En la enfermedad renal crónica, las proteínas, el potasio, el fósforo y los líquidos deben individualizarse. La aplicación no calcula objetivos para ti: pide un plan a un nefrólogo o dietista clínico.","Na doença renal crónica, proteínas, potássio, fósforo e líquidos têm de ser individualizados. A aplicação não calcula metas para si — peça um plano a um nefrologista ou dietista clínico.","Bei chronischer Nierenerkrankung müssen Eiweiß, Kalium, Phosphor und Flüssigkeit individuell festgelegt werden. Die App berechnet keine Ziele für dich — frage Nephrolog:in oder klinische Ernährungsberatung nach einem Plan.","Krónikus vesebetegségben a fehérje, kálium, foszfor és folyadék egyénileg határozandó meg. Az alkalmazás nem számol célokat neked — kérj tervet nefrológustól vagy klinikai dietetikustól.");

A('s_intro',"Țintele și sfaturile sintetizează ghiduri ale unor organizații profesionale și științifice (nu sunt citate individuale ale unor medici). Verifică întotdeauna sursa originală.","Targets and advice synthesise guidelines from professional and scientific organisations (not quotes from individual clinicians). Always check the original source.","Les objectifs et conseils synthétisent les recommandations d’organisations professionnelles et scientifiques (pas des citations de praticiens). Vérifiez toujours la source originale.","Obiettivi e consigli sintetizzano le linee guida di organizzazioni professionali e scientifiche (non citazioni di singoli clinici). Verifica sempre la fonte originale.","Los objetivos y consejos sintetizan guías de organizaciones profesionales y científicas (no citas de clínicos concretos). Comprueba siempre la fuente original.","As metas e os conselhos sintetizam guias de organizações profissionais e científicas (não são citações de clínicos individuais). Verifique sempre a fonte original.","Ziele und Empfehlungen fassen Leitlinien fachlicher und wissenschaftlicher Organisationen zusammen (keine Zitate einzelner Ärzte). Prüfe stets die Originalquelle.","A célok és tanácsok szakmai és tudományos szervezetek irányelveit összegzik (nem egyes orvosok idézetei). Mindig ellenőrizd az eredeti forrást.");

A('tip_maint',"Menține ≈{0} kcal/zi; greutatea rămâne stabilă dacă activitatea ta rămâne similară.","Keep to ≈{0} kcal/day; your weight should stay stable if your activity stays similar.","Visez ≈{0} kcal/jour ; votre poids reste stable si votre activité reste similaire.","Mantieni ≈{0} kcal/giorno; il peso resta stabile se l’attività resta simile.","Mantén ≈{0} kcal/día; tu peso seguirá estable si tu actividad se mantiene.","Mantenha ≈{0} kcal/dia; o peso mantém-se estável se a atividade for semelhante.","Bleibe bei ≈{0} kcal/Tag; dein Gewicht bleibt stabil, wenn deine Aktivität ähnlich bleibt.","Tartsd ≈{0} kcal/nap körül; a súlyod stabil marad, ha a mozgásod hasonló.");
A('tip_gain',"Țintă ≈{0} kcal/zi (surplus ≈10%), cu proteine suficiente și antrenament de forță, pentru ca excesul să devină masă musculară.","Target ≈{0} kcal/day (≈10% surplus) with enough protein and strength training, so the surplus becomes muscle.","Objectif ≈{0} kcal/jour (surplus ≈10 %) avec assez de protéines et de renforcement, pour que le surplus devienne du muscle.","Obiettivo ≈{0} kcal/giorno (surplus ≈10%) con proteine sufficienti e allenamento di forza, perché l’eccesso diventi muscolo.","Objetivo ≈{0} kcal/día (superávit ≈10 %) con suficiente proteína y entrenamiento de fuerza, para que el excedente sea músculo.","Meta ≈{0} kcal/dia (excedente ≈10%) com proteína suficiente e treino de força, para que o excedente se torne músculo.","Ziel ≈{0} kcal/Tag (≈10 % Überschuss) mit ausreichend Eiweiß und Krafttraining, damit der Überschuss zu Muskeln wird.","Cél ≈{0} kcal/nap (≈10% többlet) elegendő fehérjével és erősítéssel, hogy a többlet izommá váljon.");
A('tip_plate',"Farfuria sănătoasă: jumătate legume și fructe (≥400 g/zi), un sfert cereale integrale, un sfert proteine sănătoase (leguminoase, pește, ouă, carne slabă), ulei vegetal; apă ca băutură de bază.","Healthy plate: half vegetables and fruit (≥400 g/day), a quarter whole grains, a quarter healthy protein (legumes, fish, eggs, lean meat), plant oils; water as your main drink.","Assiette saine : moitié légumes et fruits (≥400 g/jour), un quart de céréales complètes, un quart de protéines saines (légumineuses, poisson, œufs, viande maigre), huiles végétales ; l’eau comme boisson principale.","Piatto sano: metà verdura e frutta (≥400 g/giorno), un quarto cereali integrali, un quarto proteine sane (legumi, pesce, uova, carne magra), oli vegetali; acqua come bevanda principale.","Plato saludable: la mitad verduras y fruta (≥400 g/día), un cuarto cereales integrales, un cuarto proteína saludable (legumbres, pescado, huevos, carne magra), aceites vegetales; agua como bebida principal.","Prato saudável: metade legumes e fruta (≥400 g/dia), um quarto cereais integrais, um quarto proteína saudável (leguminosas, peixe, ovos, carne magra), óleos vegetais; água como bebida principal.","Gesunder Teller: halb Gemüse und Obst (≥400 g/Tag), ein Viertel Vollkorn, ein Viertel gesundes Eiweiß (Hülsenfrüchte, Fisch, Eier, mageres Fleisch), Pflanzenöle; Wasser als Hauptgetränk.","Egészséges tányér: fele zöldség és gyümölcs (napi ≥400 g), negyede teljes kiőrlésű gabona, negyede egészséges fehérje (hüvelyesek, hal, tojás, sovány hús), növényi olajok; fő italod a víz.");
A('tip_protein',"Proteine: ≈{0} g/zi ({1} g/kg), împărțite în 3–4 mese (20–30 g/masă) pentru sinteză musculară mai bună.","Protein: ≈{0} g/day ({1} g/kg), spread over 3–4 meals (20–30 g each) for better muscle protein synthesis.","Protéines : ≈{0} g/jour ({1} g/kg), réparties sur 3–4 repas (20–30 g chacun) pour une meilleure synthèse musculaire.","Proteine: ≈{0} g/giorno ({1} g/kg), distribuite in 3–4 pasti (20–30 g ciascuno) per una migliore sintesi muscolare.","Proteínas: ≈{0} g/día ({1} g/kg), repartidas en 3–4 comidas (20–30 g cada una) para una mejor síntesis muscular.","Proteínas: ≈{0} g/dia ({1} g/kg), repartidas por 3–4 refeições (20–30 g cada) para melhor síntese muscular.","Eiweiß: ≈{0} g/Tag ({1} g/kg), auf 3–4 Mahlzeiten verteilt (je 20–30 g) für eine bessere Muskelproteinsynthese.","Fehérje: ≈{0} g/nap ({1} g/ttkg), 3–4 étkezésre elosztva (étkezésenként 20–30 g) a jobb izomfehérje-szintézisért.");
A('tip_fiber',"Fibre: ≥{0} g/zi din cereale integrale, leguminoase, legume, fructe și semințe; crește treptat și bea apă suficientă.","Fibre: ≥{0} g/day from whole grains, legumes, vegetables, fruit and seeds; increase gradually and drink enough water.","Fibres : ≥{0} g/jour issues de céréales complètes, légumineuses, légumes, fruits et graines ; augmentez progressivement et buvez suffisamment.","Fibre: ≥{0} g/giorno da cereali integrali, legumi, verdura, frutta e semi; aumenta gradualmente e bevi abbastanza.","Fibra: ≥{0} g/día de cereales integrales, legumbres, verduras, fruta y semillas; auméntala poco a poco y bebe suficiente agua.","Fibra: ≥{0} g/dia de cereais integrais, leguminosas, legumes, fruta e sementes; aumente gradualmente e beba água suficiente.","Ballaststoffe: ≥{0} g/Tag aus Vollkorn, Hülsenfrüchten, Gemüse, Obst und Samen; langsam steigern und genug trinken.","Rost: napi ≥{0} g teljes kiőrlésű gabonából, hüvelyesekből, zöldségből, gyümölcsből és magvakból; fokozatosan növeld, és igyál eleget.");
A('tip_sugar',"Zahăr liber: sub {0} g/zi (10% din energie), ideal sub {1} g; evită sucurile și băuturile îndulcite, limitează dulciurile.","Free sugars: under {0} g/day (10% of energy), ideally under {1} g; skip juices and sweetened drinks, limit sweets.","Sucres libres : moins de {0} g/jour (10 % de l’énergie), idéalement moins de {1} g ; évitez jus et boissons sucrées, limitez les sucreries.","Zuccheri liberi: meno di {0} g/giorno (10% dell’energia), idealmente meno di {1} g; evita succhi e bevande zuccherate, limita i dolci.","Azúcares libres: menos de {0} g/día (10 % de la energía), idealmente menos de {1} g; evita zumos y bebidas azucaradas, limita los dulces.","Açúcares livres: menos de {0} g/dia (10% da energia), idealmente menos de {1} g; evite sumos e bebidas açucaradas, limite os doces.","Freie Zucker: unter {0} g/Tag (10 % der Energie), idealerweise unter {1} g; Säfte und Süßgetränke meiden, Süßes begrenzen.","Szabad cukor: napi {0} g alatt (az energia 10%-a), ideálisan {1} g alatt; kerüld a gyümölcsleveket és üdítőket, korlátozd az édességet.");
A('tip_salt',"Sare: sub 5 g/zi (≈1 linguriță), inclusiv cea din pâine, brânzeturi, mezeluri și conserve; gustă înainte să sărezi, folosește ierburi și lămâie.","Salt: under 5 g/day (≈1 teaspoon) including the salt in bread, cheese, cured meats and canned food; taste before salting, use herbs and lemon.","Sel : moins de 5 g/jour (≈1 cuillère à café), y compris celui du pain, fromages, charcuteries et conserves ; goûtez avant de saler, utilisez herbes et citron.","Sale: meno di 5 g/giorno (≈1 cucchiaino), compreso quello di pane, formaggi, salumi e conserve; assaggia prima di salare, usa erbe e limone.","Sal: menos de 5 g/día (≈1 cucharadita), incluida la del pan, quesos, embutidos y conservas; prueba antes de salar, usa hierbas y limón.","Sal: menos de 5 g/dia (≈1 colher de chá), incluindo a do pão, queijos, enchidos e conservas; prove antes de salgar, use ervas e limão.","Salz: unter 5 g/Tag (≈1 Teelöffel) inklusive Brot, Käse, Wurst und Konserven; erst probieren, mit Kräutern und Zitrone würzen.","Só: napi 5 g alatt (≈1 teáskanál), a kenyér, sajt, felvágottak és konzervek sójával együtt; sózás előtt kóstold meg, használj fűszernövényeket és citromot.");
A('tip_fat',"Grăsimi ≈{1}% din energie, majoritar nesaturate (ulei de măsline, nuci, semințe, pește); grăsimi saturate sub {0} g/zi; evită grăsimile trans.","Fat ≈{1}% of energy, mostly unsaturated (olive oil, nuts, seeds, fish); saturated fat under {0} g/day; avoid trans fats.","Lipides ≈{1} % de l’énergie, surtout insaturés (huile d’olive, noix, graines, poisson) ; graisses saturées sous {0} g/jour ; évitez les graisses trans.","Grassi ≈{1}% dell’energia, soprattutto insaturi (olio d’oliva, frutta secca, semi, pesce); grassi saturi sotto {0} g/giorno; evita i grassi trans.","Grasas ≈{1} % de la energía, sobre todo insaturadas (aceite de oliva, frutos secos, semillas, pescado); saturadas por debajo de {0} g/día; evita las grasas trans.","Gorduras ≈{1}% da energia, sobretudo insaturadas (azeite, frutos secos, sementes, peixe); saturadas abaixo de {0} g/dia; evite gorduras trans.","Fett ≈{1} % der Energie, überwiegend ungesättigt (Olivenöl, Nüsse, Samen, Fisch); gesättigte Fette unter {0} g/Tag; Transfette meiden.","Zsír ≈{1}% az energiából, főleg telítetlen (olívaolaj, magvak, hal); telített zsír {0} g/nap alatt; kerüld a transzzsírokat.");
A('tip_animal',"Pește de 2 ori/săpt. (unul gras: somon, sardine); carne roșie cel mult ≈350–500 g gătită/săpt., fără mezeluri procesate; leguminoase de 3–4 ori/săpt.","Fish twice a week (one oily: salmon, sardines); red meat at most ≈350–500 g cooked per week, no processed meats; legumes 3–4 times a week.","Poisson 2 fois par semaine (dont un gras : saumon, sardines) ; viande rouge au plus ≈350–500 g cuits par semaine, pas de charcuteries ; légumineuses 3–4 fois par semaine.","Pesce 2 volte a settimana (uno grasso: salmone, sardine); carne rossa al massimo ≈350–500 g cotti a settimana, niente salumi; legumi 3–4 volte a settimana.","Pescado 2 veces por semana (uno azul: salmón, sardinas); carne roja como máximo ≈350–500 g cocinados por semana, sin procesados cárnicos; legumbres 3–4 veces por semana.","Peixe 2 vezes por semana (um gordo: salmão, sardinhas); carne vermelha no máximo ≈350–500 g cozinhados por semana, sem processados; leguminosas 3–4 vezes por semana.","Fisch 2-mal pro Woche (einmal fettreich: Lachs, Sardinen); rotes Fleisch höchstens ≈350–500 g gegart pro Woche, keine verarbeiteten Fleischwaren; Hülsenfrüchte 3–4-mal pro Woche.","Hal hetente kétszer (egyszer zsíros: lazac, szardínia); vörös hús legfeljebb ≈350–500 g főve hetente, feldolgozott húskészítmény nélkül; hüvelyesek hetente 3–4-szer.");
A('tip_process',"Alege alimente puțin procesate, gătite acasă; limitează produsele ultraprocesate (snacksuri, patiserie, cârnați, băuturi dulci).","Choose minimally processed, home-cooked food; limit ultra-processed products (snacks, pastries, sausages, sweet drinks).","Privilégiez des aliments peu transformés, cuisinés maison ; limitez les produits ultra-transformés (snacks, viennoiseries, saucisses, boissons sucrées).","Scegli cibi poco processati, cucinati in casa; limita i prodotti ultraprocessati (snack, dolci confezionati, salsicce, bevande zuccherate).","Elige alimentos poco procesados y cocinados en casa; limita los ultraprocesados (snacks, bollería, salchichas, bebidas azucaradas).","Escolha alimentos pouco processados e cozinhados em casa; limite os ultraprocessados (snacks, pastelaria, salsichas, bebidas açucaradas).","Bevorzuge wenig verarbeitete, selbst gekochte Speisen; ultra-verarbeitete Produkte (Snacks, Gebäck, Würstchen, Süßgetränke) begrenzen.","Válassz kevéssé feldolgozott, házilag főzött ételeket; korlátozd az ultrafeldolgozott termékeket (snackek, péksütemények, kolbászok, üdítők).");
A('tip_water',"Hidratare: ≈{0} L lichide totale/zi (inclusiv din alimente), mai mult la căldură sau efort. Alcool: cât mai puțin; niciun nivel nu este complet sigur.","Hydration: ≈{0} L total fluids/day (including food), more in heat or exercise. Alcohol: as little as possible; no level is completely safe.","Hydratation : ≈{0} L de liquides totaux/jour (aliments inclus), plus par temps chaud ou à l’effort. Alcool : le moins possible ; aucun niveau n’est totalement sans risque.","Idratazione: ≈{0} L di liquidi totali/giorno (cibo incluso), di più con il caldo o l’attività. Alcol: il meno possibile; nessun livello è del tutto sicuro.","Hidratación: ≈{0} L de líquidos totales/día (incluidos los alimentos), más con calor o ejercicio. Alcohol: lo mínimo posible; ningún nivel es del todo seguro.","Hidratação: ≈{0} L de líquidos totais/dia (incluindo alimentos), mais com calor ou exercício. Álcool: o mínimo possível; nenhum nível é totalmente seguro.","Flüssigkeit: ≈{0} L gesamt/Tag (inkl. Nahrung), mehr bei Hitze oder Sport. Alkohol: so wenig wie möglich; kein Konsum ist völlig risikofrei.","Hidratáció: ≈{0} L összes folyadék naponta (az ételekkel együtt), hőségben vagy edzéskor több. Alkohol: minél kevesebb; nincs teljesen biztonságos mennyiség.");
A('tip_move',"Mișcare: 150–300 min/săpt. de efort moderat și 2 zile de exerciții de forță; mișcarea completează alimentația.","Movement: 150–300 min/week of moderate activity plus 2 days of strength training; it complements nutrition.","Activité : 150 à 300 min/semaine d’effort modéré et 2 jours de renforcement musculaire ; elle complète l’alimentation.","Movimento: 150–300 min/settimana di attività moderata e 2 giorni di esercizi di forza; completa l’alimentazione.","Movimiento: 150–300 min/semana de actividad moderada y 2 días de fuerza; complementa la alimentación.","Movimento: 150–300 min/semana de atividade moderada e 2 dias de treino de força; complementa a alimentação.","Bewegung: 150–300 Min./Woche moderate Aktivität plus 2 Tage Krafttraining; sie ergänzt die Ernährung.","Mozgás: heti 150–300 perc mérsékelt aktivitás és 2 nap erősítés; kiegészíti a táplálkozást.");
A('tip_vegan',"Vegan: B12 obligatoriu (supliment sau alimente fortificate); urmărește fierul, zincul, iodul, calciul și omega-3 (in, chia, nuci); combină leguminoase cu cereale.","Vegan: B12 is essential (supplement or fortified foods); watch iron, zinc, iodine, calcium and omega-3 (flax, chia, walnuts); combine legumes with grains.","Végétalien : la B12 est indispensable (complément ou aliments enrichis) ; surveillez fer, zinc, iode, calcium et oméga-3 (lin, chia, noix) ; associez légumineuses et céréales.","Vegano: la B12 è indispensabile (integratore o alimenti fortificati); attenzione a ferro, zinco, iodio, calcio e omega-3 (lino, chia, noci); abbina legumi e cereali.","Vegano: la B12 es imprescindible (suplemento o alimentos enriquecidos); vigila hierro, zinc, yodo, calcio y omega-3 (lino, chía, nueces); combina legumbres y cereales.","Vegano: a B12 é indispensável (suplemento ou alimentos fortificados); atenção a ferro, zinco, iodo, cálcio e ómega-3 (linhaça, chia, nozes); combine leguminosas com cereais.","Vegan: B12 ist unverzichtbar (Supplement oder angereicherte Lebensmittel); Eisen, Zink, Jod, Kalzium und Omega-3 (Lein, Chia, Walnüsse) beachten; Hülsenfrüchte mit Getreide kombinieren.","Vegán: a B12 nélkülözhetetlen (kiegészítő vagy dúsított étel); figyelj a vasra, cinkre, jódra, kalciumra és omega-3-ra (len, chia, dió); párosítsd a hüvelyeseket gabonával.");
A('tip_veg',"Vegetarian: asociază sursele de fier (leguminoase, semințe de dovleac) cu vitamina C; B12 din lactate și ouă; verifică periodic feritina și B12.","Vegetarian: pair iron sources (legumes, pumpkin seeds) with vitamin C; get B12 from dairy and eggs; check ferritin and B12 periodically.","Végétarien : associez les sources de fer (légumineuses, graines de courge) à la vitamine C ; B12 via laitages et œufs ; contrôlez ferritine et B12 régulièrement.","Vegetariano: abbina le fonti di ferro (legumi, semi di zucca) alla vitamina C; B12 da latticini e uova; controlla periodicamente ferritina e B12.","Vegetariano: combina las fuentes de hierro (legumbres, pipas de calabaza) con vitamina C; B12 de lácteos y huevos; controla periódicamente ferritina y B12.","Vegetariano: combine fontes de ferro (leguminosas, sementes de abóbora) com vitamina C; B12 de laticínios e ovos; verifique periodicamente ferritina e B12.","Vegetarisch: Eisenquellen (Hülsenfrüchte, Kürbiskerne) mit Vitamin C kombinieren; B12 aus Milch und Eiern; Ferritin und B12 regelmäßig prüfen lassen.","Vegetáriánus: a vasforrásokat (hüvelyesek, tökmag) párosítsd C-vitaminnal; a B12 tejből és tojásból jön; időnként ellenőriztesd a ferritint és a B12-t.");
A('tip_dm2',"Diabet/prediabet: repartizează uniform carbohidrații în mese, alege indice glicemic mic (integrale, leguminoase), multe legume fără amidon, evită sucurile; urmează schema stabilită de medic.","Diabetes/prediabetes: spread carbohydrates evenly across meals, choose low-GI foods (whole grains, legumes), plenty of non-starchy vegetables, avoid sugary drinks; follow your doctor’s plan.","Diabète/prédiabète : répartissez les glucides régulièrement sur les repas, choisissez des aliments à IG bas (céréales complètes, légumineuses), beaucoup de légumes non féculents, évitez les boissons sucrées ; suivez le plan de votre médecin.","Diabete/prediabete: distribuisci i carboidrati in modo uniforme nei pasti, scegli alimenti a basso IG (integrali, legumi), molte verdure non amidacee, evita le bevande zuccherate; segui il piano del medico.","Diabetes/prediabetes: reparte los hidratos de carbono de forma uniforme, elige alimentos de IG bajo (integrales, legumbres), muchas verduras no feculentas, evita las bebidas azucaradas; sigue el plan de tu médico.","Diabetes/pré-diabetes: distribua os hidratos de carbono de forma uniforme pelas refeições, escolha alimentos de IG baixo (integrais, leguminosas), muitos legumes não amiláceos, evite bebidas açucaradas; siga o plano do seu médico.","Diabetes/Prädiabetes: Kohlenhydrate gleichmäßig auf die Mahlzeiten verteilen, niedrigen GI wählen (Vollkorn, Hülsenfrüchte), viel stärkearmes Gemüse, Süßgetränke meiden; dem Plan deines Arztes folgen.","Cukorbetegség/prediabétesz: oszd el egyenletesen a szénhidrátot, válassz alacsony glikémiás indexű ételeket (teljes kiőrlésű, hüvelyesek), sok nem keményítős zöldséget, kerüld az édes italokat; kövesd az orvosod tervét.");
A('tip_htn',"Hipertensiune: tipar DASH (legume, fructe, lactate slabe, cereale integrale), sare sub 5 g, alimente bogate în potasiu; dacă iei tratament sau ai boală renală, cere sfatul medicului înainte să crești potasiul.","High blood pressure: DASH pattern (vegetables, fruit, low-fat dairy, whole grains), salt under 5 g, potassium-rich foods; if you take medication or have kidney disease, ask your doctor before increasing potassium.","Hypertension : modèle DASH (légumes, fruits, laitages allégés, céréales complètes), sel sous 5 g, aliments riches en potassium ; si vous prenez un traitement ou avez une maladie rénale, demandez conseil avant d’augmenter le potassium.","Ipertensione: schema DASH (verdura, frutta, latticini magri, cereali integrali), sale sotto 5 g, alimenti ricchi di potassio; se prendi farmaci o hai una malattia renale, chiedi al medico prima di aumentare il potassio.","Hipertensión: patrón DASH (verduras, fruta, lácteos bajos en grasa, cereales integrales), sal por debajo de 5 g, alimentos ricos en potasio; si tomas medicación o tienes enfermedad renal, consulta antes de aumentar el potasio.","Hipertensão: padrão DASH (legumes, fruta, laticínios magros, cereais integrais), sal abaixo de 5 g, alimentos ricos em potássio; se toma medicação ou tem doença renal, consulte o médico antes de aumentar o potássio.","Bluthochdruck: DASH-Muster (Gemüse, Obst, fettarme Milchprodukte, Vollkorn), Salz unter 5 g, kaliumreiche Lebensmittel; bei Medikamenten oder Nierenerkrankung vor mehr Kalium den Arzt fragen.","Magas vérnyomás: DASH-étrend (zöldség, gyümölcs, alacsony zsírtartalmú tejtermék, teljes kiőrlésű gabona), 5 g alatti só, káliumban gazdag ételek; gyógyszer vagy vesebetegség esetén a több kálium előtt kérdezd az orvost.");
A('tip_chol',"Colesterol crescut: grăsimi saturate ≈6% din energie, fibre solubile (ovăz, leguminoase, fructe), nuci, ulei de măsline, pește; fără grăsimi trans.","High cholesterol: saturated fat ≈6% of energy, soluble fibre (oats, legumes, fruit), nuts, olive oil, fish; no trans fats.","Cholestérol élevé : graisses saturées ≈6 % de l’énergie, fibres solubles (avoine, légumineuses, fruits), noix, huile d’olive, poisson ; pas de graisses trans.","Colesterolo alto: grassi saturi ≈6% dell’energia, fibre solubili (avena, legumi, frutta), frutta secca, olio d’oliva, pesce; niente grassi trans.","Colesterol alto: grasas saturadas ≈6 % de la energía, fibra soluble (avena, legumbres, fruta), frutos secos, aceite de oliva, pescado; sin grasas trans.","Colesterol elevado: gorduras saturadas ≈6% da energia, fibra solúvel (aveia, leguminosas, fruta), frutos secos, azeite, peixe; sem gorduras trans.","Erhöhtes Cholesterin: gesättigte Fette ≈6 % der Energie, lösliche Ballaststoffe (Hafer, Hülsenfrüchte, Obst), Nüsse, Olivenöl, Fisch; keine Transfette.","Magas koleszterin: telített zsír ≈6% az energiából, oldódó rostok (zab, hüvelyesek, gyümölcs), magvak, olívaolaj, hal; transzzsír nélkül.");
A('tip_preg',"Sarcină/alăptare: fără regim de slăbire; acid folic 400 µg/zi (înainte de concepție și în primul trimestru), fier și iod conform medicului; evită alcoolul, peștele crud, ficatul, brânzeturile nepasteurizate.","Pregnancy/breastfeeding: no weight-loss diets; folic acid 400 µg/day (before conception and in the first trimester), iron and iodine as advised by your doctor; avoid alcohol, raw fish, liver and unpasteurised cheese.","Grossesse/allaitement : pas de régime amaigrissant ; acide folique 400 µg/jour (avant la conception et au premier trimestre), fer et iode selon l’avis médical ; évitez alcool, poisson cru, foie et fromages au lait cru.","Gravidanza/allattamento: niente diete dimagranti; acido folico 400 µg/giorno (prima del concepimento e nel primo trimestre), ferro e iodio secondo il medico; evita alcol, pesce crudo, fegato e formaggi non pastorizzati.","Embarazo/lactancia: sin dietas de adelgazamiento; ácido fólico 400 µg/día (antes de la concepción y en el primer trimestre), hierro y yodo según tu médico; evita alcohol, pescado crudo, hígado y quesos no pasteurizados.","Gravidez/amamentação: sem dietas de emagrecimento; ácido fólico 400 µg/dia (antes da conceção e no primeiro trimestre), ferro e iodo conforme o médico; evite álcool, peixe cru, fígado e queijos não pasteurizados.","Schwangerschaft/Stillzeit: keine Abnehmdiäten; Folsäure 400 µg/Tag (vor der Empfängnis und im ersten Trimester), Eisen und Jod nach ärztlichem Rat; Alkohol, rohen Fisch, Leber und unpasteurisierten Käse meiden.","Terhesség/szoptatás: ne fogyókúrázz; folsav napi 400 µg (fogantatás előtt és az első trimeszterben), vas és jód az orvosod tanácsa szerint; kerüld az alkoholt, nyers halat, májat és nem pasztőrözött sajtot.");
A('tip_senior',"După 65 de ani: proteine ≈1,0–1,2 g/kg, vitamina D și B12, hidratare activă și exerciții de forță pentru a preveni pierderea de masă musculară.","Over 65: protein ≈1.0–1.2 g/kg, vitamin D and B12, active hydration and strength exercise to prevent muscle loss.","Après 65 ans : protéines ≈1,0–1,2 g/kg, vitamine D et B12, hydratation active et renforcement musculaire pour prévenir la perte de muscle.","Dopo i 65 anni: proteine ≈1,0–1,2 g/kg, vitamina D e B12, idratazione attiva ed esercizi di forza per prevenire la perdita muscolare.","Después de los 65: proteínas ≈1,0–1,2 g/kg, vitamina D y B12, hidratación activa y ejercicio de fuerza para prevenir la pérdida muscular.","Após os 65 anos: proteínas ≈1,0–1,2 g/kg, vitamina D e B12, hidratação ativa e exercício de força para prevenir a perda muscular.","Ab 65: Eiweiß ≈1,0–1,2 g/kg, Vitamin D und B12, bewusstes Trinken und Krafttraining gegen Muskelabbau.","65 év felett: fehérje ≈1,0–1,2 g/ttkg, D- és B12-vitamin, tudatos folyadékbevitel és erősítés az izomvesztés ellen.");
A('tip_bmilow',"IMC sub 18,5: nu urmări slăbirea; alege alimente dense energetic (nuci, ulei de măsline, lactate, leguminoase) și cere un consult medical pentru a afla cauza.","BMI below 18.5: do not aim to lose weight; choose energy-dense foods (nuts, olive oil, dairy, legumes) and see a doctor to find the cause.","IMC inférieur à 18,5 : ne cherchez pas à maigrir ; privilégiez les aliments énergétiques (noix, huile d’olive, laitages, légumineuses) et consultez un médecin pour en trouver la cause.","BMI sotto 18,5: non puntare a dimagrire; scegli alimenti ad alta densità energetica (frutta secca, olio d’oliva, latticini, legumi) e consulta un medico per capirne la causa.","IMC inferior a 18,5: no busques adelgazar; elige alimentos densos en energía (frutos secos, aceite de oliva, lácteos, legumbres) y consulta a un médico para conocer la causa.","IMC abaixo de 18,5: não procure emagrecer; escolha alimentos densos em energia (frutos secos, azeite, laticínios, leguminosas) e consulte um médico para saber a causa.","BMI unter 18,5: nicht abnehmen wollen; energiedichte Lebensmittel wählen (Nüsse, Olivenöl, Milchprodukte, Hülsenfrüchte) und die Ursache ärztlich abklären lassen.","BMI 18,5 alatt: ne fogyj tovább; válassz energiadús ételeket (magvak, olívaolaj, tejtermék, hüvelyesek), és orvossal tisztázd az okot.");
A('tip_bmihigh',"IMC ≥30: o scădere de 5–10% din greutate aduce beneficii metabolice și cardiovasculare; urmează un plan gradual și discută cu medicul.","BMI ≥30: losing 5–10% of body weight brings metabolic and cardiovascular benefits; follow a gradual plan and talk to your doctor.","IMC ≥30 : perdre 5 à 10 % du poids apporte des bénéfices métaboliques et cardiovasculaires ; suivez un plan progressif et parlez-en à votre médecin.","BMI ≥30: perdere il 5–10% del peso porta benefici metabolici e cardiovascolari; segui un piano graduale e parlane con il medico.","IMC ≥30: perder el 5–10 % del peso aporta beneficios metabólicos y cardiovasculares; sigue un plan gradual y consúltalo con tu médico.","IMC ≥30: perder 5–10% do peso traz benefícios metabólicos e cardiovasculares; siga um plano gradual e fale com o seu médico.","BMI ≥30: 5–10 % Gewichtsabnahme bringen metabolische und kardiovaskuläre Vorteile; schrittweise vorgehen und mit dem Arzt sprechen.","BMI ≥30: a testsúly 5–10%-ának leadása anyagcsere- és szív-érrendszeri előnyökkel jár; haladj fokozatosan, és beszélj az orvosoddal.");
A('ss_efsa',"Valori dietetice de referință pentru adulți (energie, proteine, fibre, vitamine, minerale) – baza tabelului de micronutrienți și a țintelor de fibre și hidratare.","Dietary reference values for adults (energy, protein, fibre, vitamins, minerals) – the basis of the micronutrient table and the fibre and hydration targets.","Valeurs nutritionnelles de référence pour adultes (énergie, protéines, fibres, vitamines, minéraux) – base du tableau des micronutriments et des repères fibres et hydratation.","Valori dietetici di riferimento per adulti (energia, proteine, fibre, vitamine, minerali) – base della tabella dei micronutrienti e degli obiettivi di fibre e idratazione.","Valores dietéticos de referencia para adultos (energía, proteínas, fibra, vitaminas, minerales): base de la tabla de micronutrientes y de las metas de fibra e hidratación.","Valores dietéticos de referência para adultos (energia, proteínas, fibra, vitaminas, minerais) – base da tabela de micronutrientes e das metas de fibra e hidratação.","Referenzwerte für die Nährstoffzufuhr bei Erwachsenen (Energie, Eiweiß, Ballaststoffe, Vitamine, Mineralstoffe) – Grundlage der Mikronährstofftabelle sowie der Ballaststoff- und Flüssigkeitsziele.","Étrendi referenciaértékek felnőtteknek (energia, fehérje, rost, vitaminok, ásványi anyagok) – a mikrotápanyag-táblázat, valamint a rost- és folyadékcélok alapja.");
A('ss_harvard',"Modelul farfuriei: jumătate legume și fructe, un sfert cereale integrale, un sfert proteine sănătoase; uleiuri sănătoase și apă; limitează ultraprocesatele.","The plate model: half vegetables and fruit, a quarter whole grains, a quarter healthy protein; healthy oils and water; limit ultra-processed foods.","Le modèle de l’assiette : moitié légumes et fruits, un quart de céréales complètes, un quart de protéines saines ; huiles saines et eau ; limiter les produits ultra-transformés.","Il modello del piatto: metà verdura e frutta, un quarto cereali integrali, un quarto proteine sane; oli sani e acqua; limitare gli ultraprocessati.","El modelo del plato: mitad verduras y fruta, un cuarto cereales integrales, un cuarto proteína saludable; aceites saludables y agua; limitar los ultraprocesados.","O modelo do prato: metade legumes e fruta, um quarto cereais integrais, um quarto proteína saudável; óleos saudáveis e água; limitar os ultraprocessados.","Das Tellermodell: halb Gemüse und Obst, ein Viertel Vollkorn, ein Viertel gesundes Eiweiß; gesunde Öle und Wasser; Ultra-Verarbeitetes begrenzen.","A tányérmodell: fele zöldség és gyümölcs, negyede teljes kiőrlésű gabona, negyede egészséges fehérje; egészséges olajok és víz; az ultrafeldolgozott ételek korlátozása.");
A('ss_med',"Tipar bogat în ulei de măsline, leguminoase, nuci, pește, legume și fructe; în studiul PREDIMED a fost asociat cu risc cardiovascular mai mic.","A pattern rich in olive oil, legumes, nuts, fish, vegetables and fruit; in the PREDIMED trial it was linked to lower cardiovascular risk.","Un modèle riche en huile d’olive, légumineuses, noix, poisson, légumes et fruits ; dans l’essai PREDIMED, il a été associé à un risque cardiovasculaire plus faible.","Un modello ricco di olio d’oliva, legumi, frutta secca, pesce, verdura e frutta; nello studio PREDIMED è stato associato a un rischio cardiovascolare minore.","Un patrón rico en aceite de oliva, legumbres, frutos secos, pescado, verduras y fruta; en el ensayo PREDIMED se asoció a menor riesgo cardiovascular.","Um padrão rico em azeite, leguminosas, frutos secos, peixe, legumes e fruta; no ensaio PREDIMED foi associado a menor risco cardiovascular.","Ein Muster reich an Olivenöl, Hülsenfrüchten, Nüssen, Fisch, Gemüse und Obst; in der PREDIMED-Studie mit geringerem Herz-Kreislauf-Risiko verbunden.","Olívaolajban, hüvelyesekben, magvakban, halban, zöldségben és gyümölcsben gazdag étrend; a PREDIMED vizsgálatban alacsonyabb szív-érrendszeri kockázattal járt együtt.");
A('ss_ada',"Plan individualizat: legume fără amidon, cereale integrale, mai puțini carbohidrați rafinați și zaharuri adăugate, carbohidrați distribuiți regulat.","Individualised plan: non-starchy vegetables, whole grains, fewer refined carbohydrates and added sugars, carbohydrates spread regularly.","Plan individualisé : légumes non féculents, céréales complètes, moins de glucides raffinés et de sucres ajoutés, glucides répartis régulièrement.","Piano individualizzato: verdure non amidacee, cereali integrali, meno carboidrati raffinati e zuccheri aggiunti, carboidrati distribuiti con regolarità.","Plan individualizado: verduras no feculentas, cereales integrales, menos hidratos refinados y azúcares añadidos, hidratos repartidos con regularidad.","Plano individualizado: legumes não amiláceos, cereais integrais, menos hidratos de carbono refinados e açúcares adicionados, hidratos distribuídos com regularidade.","Individueller Plan: stärkearmes Gemüse, Vollkorn, weniger raffinierte Kohlenhydrate und zugesetzter Zucker, regelmäßig verteilte Kohlenhydrate.","Egyéni terv: nem keményítős zöldségek, teljes kiőrlésű gabona, kevesebb finomított szénhidrát és hozzáadott cukor, rendszeresen elosztott szénhidrát.");
A('ss_nhlbi',"Tipar DASH pentru tensiune: legume, fructe, cereale integrale, lactate slabe și mai puțin sodiu (2300 mg/zi, ideal 1500 mg).","DASH pattern for blood pressure: vegetables, fruit, whole grains, low-fat dairy and less sodium (2,300 mg/day, ideally 1,500 mg).","Modèle DASH pour la tension : légumes, fruits, céréales complètes, laitages allégés et moins de sodium (2 300 mg/jour, idéalement 1 500 mg).","Schema DASH per la pressione: verdura, frutta, cereali integrali, latticini magri e meno sodio (2300 mg/giorno, idealmente 1500 mg).","Patrón DASH para la tensión: verduras, fruta, cereales integrales, lácteos bajos en grasa y menos sodio (2300 mg/día, idealmente 1500 mg).","Padrão DASH para a tensão: legumes, fruta, cereais integrais, laticínios magros e menos sódio (2300 mg/dia, idealmente 1500 mg).","DASH-Muster für den Blutdruck: Gemüse, Obst, Vollkorn, fettarme Milchprodukte und weniger Natrium (2300 mg/Tag, ideal 1500 mg).","DASH-étrend a vérnyomásért: zöldség, gyümölcs, teljes kiőrlésű gabona, alacsony zsírtartalmú tejtermék és kevesebb nátrium (2300 mg/nap, ideálisan 1500 mg).");
A('ss_issn',"Persoane active: 1,4–2,0 g proteine/kg/zi, repartizate în mese de 20–40 g.","Active people: 1.4–2.0 g protein/kg/day, spread over meals of 20–40 g.","Personnes actives : 1,4–2,0 g de protéines/kg/jour, réparties en repas de 20–40 g.","Persone attive: 1,4–2,0 g di proteine/kg/giorno, distribuite in pasti da 20–40 g.","Personas activas: 1,4–2,0 g de proteína/kg/día, repartidas en comidas de 20–40 g.","Pessoas ativas: 1,4–2,0 g de proteína/kg/dia, repartidas por refeições de 20–40 g.","Aktive Personen: 1,4–2,0 g Eiweiß/kg/Tag, verteilt auf Mahlzeiten von 20–40 g.","Aktív személyek: napi 1,4–2,0 g fehérje/ttkg, 20–40 g-os étkezésekre elosztva.");
A('ss_wcrf',"Limitează carnea roșie și evită mezelurile; mult cereale integrale, legume, fructe, leguminoase; puține băuturi dulci și alcool.","Limit red meat and avoid processed meats; plenty of whole grains, vegetables, fruit, legumes; few sugary drinks and little alcohol.","Limiter la viande rouge et éviter les charcuteries ; beaucoup de céréales complètes, légumes, fruits, légumineuses ; peu de boissons sucrées et d’alcool.","Limitare della carne rossa ed evitare i salumi; molti cereali integrali, verdura, frutta, legumi; poche bevande zuccherate e poco alcol.","Limitar la carne roja y evitar los procesados cárnicos; muchos cereales integrales, verduras, fruta, legumbres; pocas bebidas azucaradas y poco alcohol.","Limitar a carne vermelha e evitar processados; muitos cereais integrais, legumes, fruta, leguminosas; poucas bebidas açucaradas e pouco álcool.","Rotes Fleisch begrenzen, verarbeitete Fleischwaren meiden; viel Vollkorn, Gemüse, Obst, Hülsenfrüchte; wenig Süßgetränke und Alkohol.","A vörös hús korlátozása, a feldolgozott húskészítmények kerülése; sok teljes kiőrlésű gabona, zöldség, gyümölcs, hüvelyes; kevés üdítő és alkohol.");
A('ss_espen',"Adulți în vârstă: ≈1,0–1,2 g proteine/kg/zi, hidratare, prevenirea malnutriției și a sarcopeniei.","Older adults: ≈1.0–1.2 g protein/kg/day, hydration, prevention of malnutrition and sarcopenia.","Adultes âgés : ≈1,0–1,2 g de protéines/kg/jour, hydratation, prévention de la dénutrition et de la sarcopénie.","Anziani: ≈1,0–1,2 g di proteine/kg/giorno, idratazione, prevenzione di malnutrizione e sarcopenia.","Personas mayores: ≈1,0–1,2 g de proteína/kg/día, hidratación, prevención de la desnutrición y la sarcopenia.","Idosos: ≈1,0–1,2 g de proteína/kg/dia, hidratação, prevenção da desnutrição e da sarcopenia.","Ältere Erwachsene: ≈1,0–1,2 g Eiweiß/kg/Tag, Flüssigkeit, Vorbeugung von Mangelernährung und Sarkopenie.","Idősebb felnőttek: ≈1,0–1,2 g fehérje/ttkg/nap, folyadékpótlás, az alultápláltság és a szarkopénia megelőzése.");
A('ss_aand',"Dietele vegetariene și vegane bine planificate sunt adecvate; atenție la B12, fier, zinc, iod, calciu, omega-3.","Well-planned vegetarian and vegan diets are appropriate; watch B12, iron, zinc, iodine, calcium, omega-3.","Les régimes végétariens et végétaliens bien planifiés sont adaptés ; attention à la B12, au fer, zinc, iode, calcium et oméga-3.","Le diete vegetariane e vegane ben pianificate sono adeguate; attenzione a B12, ferro, zinco, iodio, calcio, omega-3.","Las dietas vegetarianas y veganas bien planificadas son adecuadas; vigila B12, hierro, zinc, yodo, calcio, omega-3.","As dietas vegetarianas e veganas bem planeadas são adequadas; atenção à B12, ferro, zinco, iodo, cálcio, ómega-3.","Gut geplante vegetarische und vegane Ernährung ist geeignet; auf B12, Eisen, Zink, Jod, Kalzium, Omega-3 achten.","A jól megtervezett vegetáriánus és vegán étrend megfelelő; figyelj a B12-re, vasra, cinkre, jódra, kalciumra, omega-3-ra.");
A('ss_aha',"Grăsimi saturate ≈5–6% din energie pentru scăderea LDL; grăsimi nesaturate, fibre, pește; fără grăsimi trans.","Saturated fat ≈5–6% of energy to lower LDL; unsaturated fats, fibre, fish; no trans fats.","Graisses saturées ≈5–6 % de l’énergie pour abaisser le LDL ; graisses insaturées, fibres, poisson ; pas de graisses trans.","Grassi saturi ≈5–6% dell’energia per ridurre l’LDL; grassi insaturi, fibre, pesce; niente grassi trans.","Grasas saturadas ≈5–6 % de la energía para reducir el LDL; grasas insaturadas, fibra, pescado; sin grasas trans.","Gorduras saturadas ≈5–6% da energia para reduzir o LDL; gorduras insaturadas, fibra, peixe; sem gorduras trans.","Gesättigte Fette ≈5–6 % der Energie zur LDL-Senkung; ungesättigte Fette, Ballaststoffe, Fisch; keine Transfette.","Telített zsír ≈5–6% az energiából az LDL csökkentésére; telítetlen zsírok, rost, hal; transzzsír nélkül.");

A('note_adj',"Obiectivul a fost ajustat la menținere din motive de siguranță (sarcină/alăptare, subponderal, obezitate cu obiectiv de creștere în greutate sau un deficit prea mic pentru a conta). Discută obiectivul cu medicul.","Your goal was adjusted to maintenance for safety (pregnancy/breastfeeding, underweight, obesity with a weight-gain goal, or a deficit too small to matter). Discuss your goal with your doctor.","Votre objectif a été ajusté au maintien par sécurité (grossesse/allaitement, insuffisance pondérale, obésité avec objectif de prise de poids, ou déficit trop faible pour compter). Discutez-en avec votre médecin.","Per sicurezza l’obiettivo è stato portato al mantenimento (gravidanza/allattamento, sottopeso, obesità con obiettivo di aumento di peso o deficit troppo piccolo per essere significativo). Parlane con il medico.","Por seguridad, tu objetivo se ha ajustado a mantenimiento (embarazo/lactancia, bajo peso, obesidad con objetivo de aumento de peso o un déficit demasiado pequeño para ser relevante). Coméntalo con tu médico.","Por segurança, o objetivo foi ajustado para manutenção (gravidez/amamentação, baixo peso, obesidade com objetivo de ganho de peso ou um défice demasiado pequeno para contar). Fale com o seu médico.","Aus Sicherheitsgründen wurde dein Ziel auf Gewichtserhalt angepasst (Schwangerschaft/Stillzeit, Untergewicht, Adipositas mit Zunahmeziel oder ein zu kleines Defizit). Besprich dein Ziel mit deinem Arzt.","Biztonsági okból a célodat súlytartásra módosítottuk (terhesség/szoptatás, alulsúly, elhízás súlygyarapodási céllal, vagy túl kicsi energiahiány). Beszéld meg az orvosoddal.");
A('note_low',"Necesarul tău estimat este foarte scăzut (sub 1200 kcal/zi). Aplicația nu recomandă niciodată mai puțin de 1200 kcal/zi; discută cu un medic sau dietetician.","Your estimated needs are very low (under 1,200 kcal/day). The app never recommends less than 1,200 kcal/day; talk to a doctor or dietitian.","Vos besoins estimés sont très faibles (moins de 1 200 kcal/jour). L’application ne recommande jamais moins de 1 200 kcal/jour ; parlez-en à un médecin ou à un diététicien.","Il tuo fabbisogno stimato è molto basso (sotto 1200 kcal/giorno). L’app non raccomanda mai meno di 1200 kcal/giorno; parlane con un medico o un dietista.","Tus necesidades estimadas son muy bajas (menos de 1200 kcal/día). La aplicación nunca recomienda menos de 1200 kcal/día; consúltalo con un médico o dietista.","As suas necessidades estimadas são muito baixas (abaixo de 1200 kcal/dia). A aplicação nunca recomenda menos de 1200 kcal/dia; fale com um médico ou dietista.","Dein geschätzter Bedarf ist sehr niedrig (unter 1200 kcal/Tag). Die App empfiehlt nie weniger als 1200 kcal/Tag; sprich mit Arzt oder Ernährungsberater.","A becsült szükségleted nagyon alacsony (napi 1200 kcal alatt). Az alkalmazás sosem javasol 1200 kcal/nap alatti értéket; beszélj orvossal vagy dietetikussal.");
A('note_tw',"Greutatea țintă este sub intervalul sănătos pentru înălțimea ta ({0}–{1} kg). Alege o țintă din interval sau discut-o cu medicul.","Your target weight is below the healthy range for your height ({0}–{1} kg). Choose a target within the range or discuss it with your doctor.","Votre poids cible est inférieur à la plage saine pour votre taille ({0}–{1} kg). Choisissez une cible dans la plage ou parlez-en à votre médecin.","Il peso obiettivo è sotto l’intervallo salutare per la tua altezza ({0}–{1} kg). Scegli un obiettivo nell’intervallo o parlane con il medico.","Tu peso objetivo está por debajo del rango saludable para tu altura ({0}–{1} kg). Elige un objetivo dentro del rango o coméntalo con tu médico.","O seu peso-alvo está abaixo do intervalo saudável para a sua altura ({0}–{1} kg). Escolha um alvo dentro do intervalo ou fale com o seu médico.","Dein Zielgewicht liegt unter dem gesunden Bereich für deine Größe ({0}–{1} kg). Wähle ein Ziel im Bereich oder besprich es mit deinem Arzt.","A célsúlyod a magasságodhoz tartozó egészséges tartomány alatt van ({0}–{1} kg). Válassz a tartományon belüli célt, vagy beszéld meg az orvosoddal.");
A('tip_preg2',"Necesarul de energie crește în trimestrele 2 și 3 (≈+250–500 kcal/zi) și în alăptarea exclusivă (≈+330 kcal/zi); cere medicului sau moașei o țintă personalizată.","Energy needs rise in the 2nd and 3rd trimesters (≈+250–500 kcal/day) and during exclusive breastfeeding (≈+330 kcal/day); ask your doctor or midwife for a personalised target.","Les besoins énergétiques augmentent aux 2e et 3e trimestres (≈ +250 à 500 kcal/jour) et pendant l’allaitement exclusif (≈ +330 kcal/jour) ; demandez un objectif personnalisé à votre médecin ou sage-femme.","Il fabbisogno energetico aumenta nel 2° e 3° trimestre (≈ +250–500 kcal/giorno) e durante l’allattamento esclusivo (≈ +330 kcal/giorno); chiedi a medico o ostetrica un obiettivo personalizzato.","Las necesidades de energía aumentan en el 2.º y 3.er trimestre (≈ +250–500 kcal/día) y durante la lactancia exclusiva (≈ +330 kcal/día); pide a tu médico o matrona un objetivo personalizado.","As necessidades energéticas aumentam no 2.º e 3.º trimestres (≈ +250–500 kcal/dia) e na amamentação exclusiva (≈ +330 kcal/dia); peça ao médico ou enfermeiro obstetra uma meta personalizada.","Der Energiebedarf steigt im 2. und 3. Trimester (≈ +250–500 kcal/Tag) und beim ausschließlichen Stillen (≈ +330 kcal/Tag); lass dir von Arzt oder Hebamme ein persönliches Ziel nennen.","Az energiaigény a 2. és 3. trimeszterben (≈ +250–500 kcal/nap) és kizárólagos szoptatás alatt (≈ +330 kcal/nap) nő; kérj személyre szabott célt orvostól vagy szülésznőtől.");
A('tip_lose',"Țintă ≈{0} kcal/zi (deficit {1}%), ritm estimat ≈{2} kg/săpt. O scădere graduală (de obicei până la 0,5–1 kg/săpt.) se menține mai ușor; evită dietele drastice.","Target ≈{0} kcal/day ({1}% deficit), estimated pace ≈{2} kg/week. Gradual loss (generally up to 0.5–1 kg/week) is easier to keep off; avoid crash diets.","Objectif ≈{0} kcal/jour (déficit de {1} %), rythme estimé ≈{2} kg/semaine. Une perte progressive (en général jusqu’à 0,5–1 kg/semaine) se maintient mieux ; évitez les régimes drastiques.","Obiettivo ≈{0} kcal/giorno (deficit {1}%), ritmo stimato ≈{2} kg/settimana. Una perdita graduale (in genere fino a 0,5–1 kg/settimana) si mantiene meglio; evita le diete drastiche.","Objetivo ≈{0} kcal/día (déficit del {1} %), ritmo estimado ≈{2} kg/semana. Una pérdida gradual (por lo general hasta 0,5–1 kg/semana) se mantiene mejor; evita las dietas drásticas.","Meta ≈{0} kcal/dia (défice de {1}%), ritmo estimado ≈{2} kg/semana. Uma perda gradual (em geral até 0,5–1 kg/semana) mantém-se melhor; evite dietas drásticas.","Ziel ≈{0} kcal/Tag ({1} % Defizit), geschätztes Tempo ≈{2} kg/Woche. Ein allmählicher Verlust (in der Regel bis 0,5–1 kg/Woche) lässt sich besser halten; keine Crash-Diäten.","Cél ≈{0} kcal/nap ({1}% energiahiány), becsült ütem ≈{2} kg/hét. A fokozatos fogyást (általában hetente legfeljebb 0,5–1 kg) könnyebb megtartani; kerüld a drasztikus diétákat.");
A('ss_who',"≥400 g legume și fructe/zi; zahăr liber sub 10% din energie (ideal 5%); sare sub 5 g; grăsimi sub 30% din energie, saturate sub 10%, fără trans.","≥400 g fruit and vegetables/day; free sugars under 10% of energy (ideally 5%); salt under 5 g; fat under 30% of energy, saturated under 10%, no trans fats.","≥400 g de fruits et légumes/jour ; sucres libres sous 10 % de l’énergie (idéalement 5 %) ; sel sous 5 g ; lipides sous 30 % de l’énergie, saturés sous 10 %, sans trans.","≥400 g di frutta e verdura/giorno; zuccheri liberi sotto il 10% dell’energia (idealmente 5%); sale sotto 5 g; grassi sotto il 30% dell’energia, saturi sotto il 10%, niente trans.","≥400 g de fruta y verdura/día; azúcares libres por debajo del 10 % de la energía (idealmente 5 %); sal por debajo de 5 g; grasas por debajo del 30 % de la energía, saturadas por debajo del 10 %, sin trans.","≥400 g de fruta e legumes/dia; açúcares livres abaixo de 10% da energia (idealmente 5%); sal abaixo de 5 g; gorduras abaixo de 30% da energia, saturadas abaixo de 10%, sem trans.","≥400 g Obst und Gemüse/Tag; freie Zucker unter 10 % der Energie (ideal 5 %); Salz unter 5 g; Fett unter 30 % der Energie, gesättigt unter 10 %, keine Transfette.","Napi ≥400 g gyümölcs és zöldség; szabad cukor az energia 10%-a alatt (ideálisan 5%); só 5 g alatt; zsír az energia 30%-a alatt, ebből telített 10% alatt, transzzsír nélkül.");
A('ss_whopa',"Adulți: 150–300 min/săpt. de activitate aerobă moderată (sau 75–150 min intensă) plus exerciții de forță în cel puțin 2 zile pe săptămână.","Adults: 150–300 min/week of moderate aerobic activity (or 75–150 min vigorous) plus muscle-strengthening on at least 2 days a week.","Adultes : 150–300 min/semaine d’activité aérobie modérée (ou 75–150 min intense) et renforcement musculaire au moins 2 jours par semaine.","Adulti: 150–300 min/settimana di attività aerobica moderata (o 75–150 min intensa) più esercizi di forza almeno 2 giorni a settimana.","Adultos: 150–300 min/semana de actividad aeróbica moderada (o 75–150 min intensa) más ejercicios de fuerza al menos 2 días por semana.","Adultos: 150–300 min/semana de atividade aeróbica moderada (ou 75–150 min intensa) mais exercícios de força em pelo menos 2 dias por semana.","Erwachsene: 150–300 Min./Woche moderate Ausdaueraktivität (oder 75–150 Min. intensiv) plus Krafttraining an mindestens 2 Tagen pro Woche.","Felnőtteknek: heti 150–300 perc mérsékelt aerob aktivitás (vagy 75–150 perc intenzív) plusz izomerősítés legalább heti 2 napon.");
A('ss_cdc',"O scădere graduală și constantă (aprox. 0,5–1 kg pe săptămână) se menține mai ușor; pierderea a 5–10% din greutate aduce beneficii pentru sănătate.","Gradual, steady loss (about 0.5–1 kg, i.e. 1–2 lb, per week) is more likely to be kept off; losing 5–10% of body weight brings health benefits.","Une perte progressive et régulière (environ 0,5–1 kg par semaine) se maintient plus facilement ; perdre 5 à 10 % du poids apporte des bénéfices pour la santé.","Una perdita graduale e costante (circa 0,5–1 kg a settimana) si mantiene più facilmente; perdere il 5–10% del peso porta benefici per la salute.","Una pérdida gradual y constante (unos 0,5–1 kg por semana) se mantiene mejor; perder el 5–10 % del peso aporta beneficios para la salud.","Uma perda gradual e constante (cerca de 0,5–1 kg por semana) mantém-se mais facilmente; perder 5–10% do peso traz benefícios para a saúde.","Ein allmählicher, stetiger Gewichtsverlust (etwa 0,5–1 kg pro Woche) lässt sich eher halten; 5–10 % Gewichtsabnahme bringen gesundheitliche Vorteile.","A fokozatos, egyenletes fogyást (hetente kb. 0,5–1 kg) könnyebb megtartani; a testsúly 5–10%-ának leadása egészségügyi előnyökkel jár.");
A('no3',"Nucile, inul și chia furnizează ALA, care nu echivalează cu EPA+DHA; fără pește, o sursă din alge (supliment) se discută cu medicul sau dieteticianul.","Walnuts, flax and chia provide ALA, which is not equivalent to EPA+DHA; without fish, an algae-based supplement is a matter for your doctor or dietitian.","Noix, lin et chia apportent de l’ALA, qui n’équivaut pas à l’EPA+DHA ; sans poisson, un complément à base d’algues se discute avec votre médecin ou diététicien.","Noci, lino e chia forniscono ALA, che non equivale a EPA+DHA; senza pesce, un integratore a base di alghe va valutato con medico o dietista.","Nueces, lino y chía aportan ALA, que no equivale a EPA+DHA; sin pescado, un suplemento de algas se consulta con tu médico o dietista.","Nozes, linhaça e chia fornecem ALA, que não equivale a EPA+DHA; sem peixe, um suplemento à base de algas deve ser discutido com o médico ou dietista.","Walnüsse, Lein und Chia liefern ALA, das nicht EPA+DHA entspricht; ohne Fisch ist ein Algenpräparat mit Arzt oder Ernährungsberater zu besprechen.","A dió, len és chia ALA-t ad, ami nem egyenértékű az EPA+DHA-val; hal nélkül az algaalapú kiegészítőről orvossal vagy dietetikussal egyeztess.");
A('labels',"Verifică etichetele: pâinea, pastele și conservele pot ascunde ouă, lapte, soia sau gluten. Crustaceele, susanul, țelina, muștarul și lupinul nu sunt folosite în plan.","Check labels: bread, pasta and canned foods can hide egg, milk, soy or gluten. Shellfish, sesame, celery, mustard and lupin are not used in the plan.","Vérifiez les étiquettes : pain, pâtes et conserves peuvent cacher œuf, lait, soja ou gluten. Crustacés, sésame, céleri, moutarde et lupin ne sont pas utilisés dans le plan.","Controlla le etichette: pane, pasta e conserve possono nascondere uovo, latte, soia o glutine. Crostacei, sesamo, sedano, senape e lupino non sono usati nel piano.","Revisa las etiquetas: el pan, la pasta y las conservas pueden ocultar huevo, leche, soja o gluten. Crustáceos, sésamo, apio, mostaza y altramuz no se usan en el plan.","Verifique os rótulos: pão, massa e conservas podem esconder ovo, leite, soja ou glúten. Crustáceos, sésamo, aipo, mostarda e tremoço não são usados no plano.","Prüfe die Etiketten: Brot, Nudeln und Konserven können Ei, Milch, Soja oder Gluten verstecken. Krebstiere, Sesam, Sellerie, Senf und Lupine werden im Plan nicht verwendet.","Ellenőrizd a címkéket: a kenyér, tészta és konzerv rejthet tojást, tejet, szóját vagy glutént. Rákfélék, szezám, zeller, mustár és csillagfürt nem szerepel a tervben.");
A('plan_var',"Cu restricțiile tale există puține șabloane de mese; unele se vor repeta în cursul săptămânii.","With your restrictions there are few meal templates, so some meals will repeat during the week.","Avec vos restrictions, il y a peu de modèles de repas ; certains se répéteront durant la semaine.","Con le tue restrizioni ci sono pochi modelli di pasto; alcuni si ripeteranno durante la settimana.","Con tus restricciones hay pocas plantillas de comidas; algunas se repetirán durante la semana.","Com as suas restrições há poucos modelos de refeições; alguns repetir-se-ão durante a semana.","Mit deinen Einschränkungen gibt es wenige Mahlzeitenvorlagen; einige wiederholen sich im Lauf der Woche.","A korlátozásaiddal kevés étkezési sablon áll rendelkezésre, ezért néhány étkezés ismétlődik a héten.");

A('method',"Metodă: metabolismul bazal se estimează cu ecuația Mifflin–St Jeor; consumul total = metabolism bazal × factor de activitate (1,2–1,9). Deficitul (10–20%, maximum 1000 kcal/zi) sau excesul (≈10%) se aplică acestui consum; aplicația nu coboară sub 1200 kcal/zi (1500 la bărbați în scădere ponderală). Proteinele (0,9–1,6 g/kg, mai mult la slăbire, la peste 65 de ani sau cu efort intens, maximum 1,8) se calculează pe greutatea reală, sau pe una ajustată dacă IMC depășește 30. IMC și intervalul sănătos (18,5–24,9) sunt orientative și pot diferi la unele populații și la sportivi cu masă musculară mare. Planul de mese folosește valori medii pe 100 g și șabloane fixe; alimentele sunt filtrate după dietă, alergii și afecțiuni, dar verifică întotdeauna etichetele.","Method: basal metabolic rate is estimated with the Mifflin–St Jeor equation; total daily expenditure = BMR × activity factor (1.2–1.9). A deficit (10–20%, at most 1,000 kcal/day) or surplus (≈10%) is applied to that figure; the app never goes below 1,200 kcal/day (1,500 for men who are losing weight). Protein (0.9–1.6 g/kg, more when losing weight, over 65 or training hard, capped at 1.8) uses actual body weight, or an adjusted weight above BMI 30. BMI and the healthy range (18.5–24.9) are only indicative and may differ in some populations and in muscular athletes. The meal plan uses average values per 100 g and fixed templates; foods are filtered by diet, allergies and conditions, but always check product labels.","Méthode : le métabolisme de base est estimé par l’équation de Mifflin–St Jeor ; dépense totale = métabolisme de base × facteur d’activité (1,2–1,9). Un déficit (10–20 %, au maximum 1 000 kcal/jour) ou un surplus (≈10 %) s’applique à cette valeur ; l’application ne descend jamais sous 1 200 kcal/jour (1 500 pour les hommes qui perdent du poids). Les protéines (0,9–1,6 g/kg, davantage en cas de perte de poids, après 65 ans ou d’entraînement intense, plafonnées à 1,8) se calculent sur le poids réel, ou sur un poids ajusté si l’IMC dépasse 30. L’IMC et la plage saine (18,5–24,9) sont indicatifs et peuvent différer selon les populations et chez les sportifs musclés. Le plan de repas utilise des valeurs moyennes pour 100 g et des modèles fixes ; les aliments sont filtrés selon le régime, les allergies et les pathologies, mais vérifiez toujours les étiquettes.","Metodo: il metabolismo basale è stimato con l’equazione di Mifflin–St Jeor; dispendio totale = metabolismo basale × fattore di attività (1,2–1,9). Un deficit (10–20%, al massimo 1000 kcal/giorno) o un surplus (≈10%) si applica a questo valore; l’app non scende mai sotto 1200 kcal/giorno (1500 per gli uomini che dimagriscono). Le proteine (0,9–1,6 g/kg, di più se si dimagrisce, oltre i 65 anni o con allenamento intenso, massimo 1,8) sono calcolate sul peso reale, o su un peso corretto se il BMI supera 30. BMI e intervallo salutare (18,5–24,9) sono indicativi e possono variare in alcune popolazioni e negli atleti muscolosi. Il piano pasti usa valori medi per 100 g e modelli fissi; gli alimenti sono filtrati per dieta, allergie e condizioni, ma controlla sempre le etichette.","Método: el metabolismo basal se estima con la ecuación de Mifflin–St Jeor; gasto total = metabolismo basal × factor de actividad (1,2–1,9). Se aplica un déficit (10–20 %, como máximo 1000 kcal/día) o un superávit (≈10 %) a esa cifra; la aplicación nunca baja de 1200 kcal/día (1500 en hombres que pierden peso). La proteína (0,9–1,6 g/kg, más al adelgazar, a partir de los 65 años o con entrenamiento intenso, máximo 1,8) se calcula con el peso real, o con un peso ajustado si el IMC supera 30. El IMC y el rango saludable (18,5–24,9) son orientativos y pueden variar en algunas poblaciones y en deportistas musculosos. El plan de comidas usa valores medios por 100 g y plantillas fijas; los alimentos se filtran según dieta, alergias y afecciones, pero revisa siempre las etiquetas.","Método: o metabolismo basal é estimado com a equação de Mifflin–St Jeor; gasto total = metabolismo basal × fator de atividade (1,2–1,9). Aplica-se um défice (10–20%, no máximo 1000 kcal/dia) ou um excedente (≈10%) a esse valor; a aplicação nunca desce abaixo de 1200 kcal/dia (1500 nos homens que perdem peso). A proteína (0,9–1,6 g/kg, mais ao emagrecer, após os 65 anos ou com treino intenso, máximo 1,8) calcula-se com o peso real, ou com um peso ajustado se o IMC for superior a 30. O IMC e o intervalo saudável (18,5–24,9) são indicativos e podem diferir em algumas populações e em atletas musculados. O plano de refeições usa valores médios por 100 g e modelos fixos; os alimentos são filtrados por dieta, alergias e condições, mas verifique sempre os rótulos.","Methode: Der Grundumsatz wird mit der Mifflin-St-Jeor-Gleichung geschätzt; Gesamtumsatz = Grundumsatz × Aktivitätsfaktor (1,2–1,9). Auf diesen Wert wird ein Defizit (10–20 %, höchstens 1000 kcal/Tag) oder Überschuss (≈10 %) angewendet; die App geht nie unter 1200 kcal/Tag (1500 bei Männern, die abnehmen). Eiweiß (0,9–1,6 g/kg, mehr beim Abnehmen, über 65 oder bei hartem Training, höchstens 1,8) wird auf das tatsächliche Gewicht bezogen, bei BMI über 30 auf ein angepasstes Gewicht. BMI und gesunder Bereich (18,5–24,9) sind nur Richtwerte und können bei manchen Bevölkerungsgruppen und muskulösen Sportlern abweichen. Der Speiseplan nutzt Durchschnittswerte pro 100 g und feste Vorlagen; Lebensmittel werden nach Ernährungsform, Allergien und Erkrankungen gefiltert, prüfe aber immer die Produktetiketten.","Módszer: az alapanyagcserét a Mifflin–St Jeor egyenlettel becsüljük; teljes napi energiafelhasználás = alapanyagcsere × aktivitási tényező (1,2–1,9). Erre az értékre energiahiányt (10–20%, legfeljebb 1000 kcal/nap) vagy többletet (≈10%) alkalmazunk; az alkalmazás sosem megy 1200 kcal/nap alá (1500 a fogyó férfiaknál). A fehérjét (0,9–1,6 g/ttkg, fogyásnál, 65 év felett vagy kemény edzésnél több, legfeljebb 1,8) a tényleges testsúlyból számoljuk, 30 feletti BMI-nél korrigált súlyból. A BMI és az egészséges tartomány (18,5–24,9) tájékoztató jellegű, egyes népcsoportoknál és izmos sportolóknál eltérhet. Az étrend 100 g-ra vonatkozó átlagértékeket és rögzített sablonokat használ; az ételeket étrend, allergia és betegség szerint szűrjük, de mindig ellenőrizd a termékcímkéket.");

/* ---------- calculations ---------- */
function calc(p){
  if(problems(p).length)return null;
  var age=+p.age,h=+p.h,w=+p.w,m=p.sex==='m';
  var dm=p.cond.indexOf('dm2')>=0,chol=p.cond.indexOf('chol')>=0,preg=p.cond.indexOf('preg')>=0;
  var bmi=w/Math.pow(h/100,2);
  var bmr=10*w+6.25*h-5*age+(m?5:-161);
  var tdee=bmr*ACT[p.act];
  var goal=p.goal;
  if(preg)goal='maint';
  if(goal==='lose'&&bmi<18.5)goal='maint';
  if(goal==='gain'&&bmi>=30)goal='maint';
  var kcal=tdee;
  if(goal==='lose'){
    var pct0={1:.10,2:.15,3:.20}[p.pace]||.15;
    var def=Math.min(tdee*pct0,1000);
    kcal=tdee-def;
    var mn=m?1500:1200;
    if(kcal<mn)kcal=Math.min(mn,tdee);
  }
  if(goal==='gain')kcal=tdee*1.10;
  var low=false;
  if(kcal<1200){kcal=1200;low=true}
  kcal=Math.round(kcal/10)*10;
  if(goal==='lose'&&kcal>tdee*0.97){goal='maint';kcal=Math.max(1200,Math.round(tdee/10)*10)}
  var pct=goal==='lose'?1-kcal/tdee:0;
  var rate=goal==='lose'?(tdee-kcal)*7/7700:0;
  var w25=25*Math.pow(h/100,2),rw=bmi>30?w25+0.25*(w-w25):w;
  var pk=PK[p.act];
  if(goal==='lose')pk+=0.2;
  if(goal==='gain')pk=Math.max(pk,1.6);
  if(age>=65)pk=Math.max(pk,1.2);
  pk=Math.min(pk,1.8);
  var prot=Math.min(pk*rw,0.35*kcal/4);
  var fatPct=dm?.35:.30;
  var fat=fatPct*kcal/9,carb=(kcal-4*prot-9*fat)/4;
  if(carb<130){carb=130;fat=Math.max(.2*kcal/9,(kcal-4*prot-4*carb)/9)}
  var hmin=18.5*Math.pow(h/100,2),hmax=24.9*Math.pow(h/100,2);
  var tw=+p.tw,twlow=(p.tw!==''&&tw>0&&tw<hmin),weeks=null;
  if(p.tw!==''&&tw>0&&!twlow&&Math.abs(tw-w)>0.4){
    if(goal==='lose'&&tw<w&&rate>0.05)weeks=Math.ceil((w-tw)/rate);
    if(goal==='gain'&&tw>w){var gr=(kcal-tdee)*7/7700;if(gr>0.05)weeks=Math.ceil((tw-w)/gr)}
    if(weeks&&weeks>260)weeks=null;
  }
  var wh=+p.waist;
  return{bmi:bmi,bmr:bmr,tdee:tdee,goal:goal,adj:(p.goal!==goal),low:low,twlow:twlow,kcal:kcal,pct:pct,rate:rate,
    prot:Math.round(prot),pk:prot/w,carb:Math.round(carb),fat:Math.round(fat),fatPct:Math.round(fat*9/kcal*100),
    sat:Math.round((chol?.06:.10)*kcal/9),sug:Math.round(.10*kcal/4),sug5:Math.round(.05*kcal/4),
    fiber:Math.min(40,Math.max(dm?30:25,Math.round(14*kcal/1000))),water:m?2.5:2.0,
    hmin:hmin,hmax:hmax,weeks:weeks,tw:tw,whtr:(p.waist!==''&&wh>30)?wh/h:null};
}

/* ---------- plan generation ---------- */
function rng(sd){var a=sd>>>0;return function(){a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function shuffle(arr,r){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function mealTotals(items){var o={k:0,p:0,c:0,f:0,fb:0};items.forEach(function(it){var f=FM[it.f||it.id],q=it.g/100;o.k+=f.k*q;o.p+=f.p*q;o.c+=f.c*q;o.f+=f.f*q;o.fb+=f.fb*q});return o}
function hasHG(t){return t.it.some(function(x){return FM[x[0]].t.indexOf('hg')>=0})}
function buildPlan(p,c,sd){
  var r=rng(sd*7919+13),slots=SLOTS[p.meals]||SLOTS[4],pools={},dm=p.cond.indexOf('dm2')>=0;
  ['b','l','d','s'].forEach(function(s){
    var pool=shuffle(TPL.filter(function(t){return t.s===s&&t.it.every(function(x){return okFood(FM[x[0]],p)})}),r);
    if(dm)pool=pool.filter(function(t){return !hasHG(t)}).concat(pool.filter(hasHG));
    pools[s]=pool;
  });
  var boost=shuffle(['alm','wal','sun','pmk','avo'].filter(function(id){return okFood(FM[id],p)}),r);
  var days=[];
  days.limited=['b','l','d'].some(function(s){return pools[s].length<7});
  for(var d=0;d<7;d++){
    var sn=0;
    var meals=slots.map(function(sl){
      var s=sl[0],pool=pools[s];
      if(!pool.length)return{s:s,none:true};
      var shift=0;if(s==='s'){shift=sn*Math.floor(pool.length/2);sn++}
      var tp=pool[(d+shift)%pool.length];
      var base=0;tp.it.forEach(function(x){base+=FM[x[0]].k*x[1]/100});
      var want=c.kcal*sl[1],cap=2.5,fct=clamp(want/base,.5,cap);
      var items=tp.it.map(function(x){var q=x[1]*fct;q=q<40?Math.max(1,Math.round(q)):Math.round(q/5)*5;return{id:x[0],g:q}});
      var gap=want-mealTotals(items).k,n=0;
      while(gap>80&&fct>=cap-1e-9&&n<4){
        var bid=n===0?'oil':(boost.length?boost[(n-1)%boost.length]:'oil');
        var bf=FM[bid],g=Math.min(bid==='oil'?25:40,Math.round(gap/bf.k*100/5)*5);
        if(g<5)break;
        var ex=null;items.forEach(function(i){if(i.id===bid)ex=i});
        if(ex)ex.g+=g;else items.push({id:bid,g:g});
        gap-=bf.k*g/100;n++;
      }
      return{s:s,items:items,tot:mealTotals(items)};
    });
    days.push(meals);
  }
  return days;
}

   +'<tr><td>'+esc(t('carbs'))+'</td><td><b>'+fmt(c.carb)+' g</b></td><td class="mut">'+pC+'%</td></tr>'
