/* ----- plan ----- */
function viewPlan(){
  var lk=lockOf(P);if(lk)return lockCard(lk);
  var c=calc(P);if(!c)return '<section class="card warn"><div>'+probHTML(problems(P))+'</div></section>';
  var days=buildPlan(P,c,seed);
  var loc=LANGS[LI];
  var dn=function(i){try{return new Date(2024,0,1+i).toLocaleDateString(loc,{weekday:'long'})}catch(e){return 'D'+(i+1)}};
  var h='<section class="card noprint"><div class="row sb"><h2 style="margin:0">'+esc(t('pl_h'))+' · '+fmt(c.kcal)+' '+esc(t('kcal'))+'</h2>'
   +'<div class="row"><button data-a="regen">🔀 '+esc(t('pl_regen'))+'</button><button data-a="shop">🛒 '+esc(t('pl_shop'))+'</button><button data-a="print">🖨 '+esc(t('pl_print'))+'</button></div></div>'
   +(days.limited?'<div class="note">'+esc(t('plan_var'))+'</div>':'')+'</section>';
  h+='<div class="days noprint" role="group">'+days.map(function(d,i){return '<button type="button" data-a="day" data-id="'+i+'" aria-pressed="'+(i===planDay)+'" class="'+(i===planDay?'on':'')+'">'+esc(dn(i).slice(0,3).replace(/^./,function(x){return x.toUpperCase()}))+'</button>'}).join('')+'</div>';
  days.forEach(function(meals,i){
    var tot={k:0,p:0,c:0,f:0,fb:0};
    var mh=meals.map(function(m){
      if(m.none)return '<div class="meal"><h3>'+esc(slotName(m.s))+'</h3><p class="mut" style="margin:0">'+esc(t('nomeal'))+'</p></div>';
      ['k','p','c','f','fb'].forEach(function(k){tot[k]+=m.tot[k]});
      return '<div class="meal"><h3><span>'+esc(slotName(m.s))+'</span><span>'+fmt(m.tot.k)+' kcal</span></h3><ul>'
       +m.items.map(function(it){return '<li>'+it.g+' g · '+esc(fname(FM[it.id]))+'</li>'}).join('')+'</ul>'
       +'<div class="macs">'+esc(t('protein'))+' '+fmt(m.tot.p)+' g · '+esc(t('carbs'))+' '+fmt(m.tot.c)+' g · '+esc(t('fat'))+' '+fmt(m.tot.f)+' g</div></div>'}).join('');
    h+='<div class="day'+(i===planDay?' on':'')+'"><h2 style="margin:4px 0 10px;text-transform:capitalize">'+esc(dn(i))+'</h2><div class="meals">'+mh+'</div>'
     +'<div class="card"><b>'+esc(t('day_tot'))+': '+fmt(tot.k)+' kcal</b> <span class="mut">('+fmt(tot.k/c.kcal*100)+'% '+esc(t('oftarget'))+')</span>'
     +'<div class="macs">'+esc(t('protein'))+' '+fmt(tot.p)+' g ('+fmt(tot.p/Math.max(1,c.prot)*100)+'%) · '+esc(t('carbs'))+' '+fmt(tot.c)+' g · '+esc(t('fat'))+' '+fmt(tot.f)+' g · '+esc(t('fiber'))+' '+fmt(tot.fb)+' g</div></div></div>';
  });
  h+='<p class="mut" style="font-size:.82rem">'+esc(t('cooked'))+' '+esc(t('labels'))+' '+esc(t('disc'))+'</p>';
  return h;
}
function openShop(){
  var c=calc(P);if(!c||lockOf(P))return;
  var days=buildPlan(P,c,seed),agg={};
  days.forEach(function(ms){ms.forEach(function(m){if(m.items)m.items.forEach(function(it){agg[it.id]=(agg[it.id]||0)+it.g})})});
  var h='<h2 style="margin-top:0">🛒 '+esc(t('pl_shop'))+'</h2>';
  GROUPS.forEach(function(g){
    var ids=Object.keys(agg).filter(function(id){return FM[id].g===g});
    if(!ids.length)return;
    h+='<p class="mut" style="margin:10px 0 2px"><b>'+esc(t('g_'+g))+'</b></p><ul style="margin:0;padding-left:18px">'+ids.map(function(id){return '<li>'+esc(fname(FM[id]))+' — '+fmt(Math.round(agg[id]/10)*10)+' g</li>'}).join('')+'</ul>';
  });
  h+='<p class="mut" style="font-size:.8rem">'+esc(t('cooked'))+' '+esc(t('labels'))+'</p><div class="row"><button class="pri" data-a="dclose">'+esc(t('close'))+'</button></div>';
  showDlg(h);
}

function spark(){
  var a=WT.slice(-30);
  if(!a.length)return '';
  if(a.length<2)return '<p class="mut" style="margin:8px 0 0">'+fmt(a[0].w,1)+' kg · '+esc(a[0].d)+'</p>';
  var mn=Math.min.apply(null,a.map(function(x){return x.w})),mx=Math.max.apply(null,a.map(function(x){return x.w})),rg=(mx-mn)||1;
  var pts=a.map(function(x,i){return(i/(a.length-1)*300).toFixed(1)+','+(50-(x.w-mn)/rg*44-3).toFixed(1)}).join(' ');
  var diff=a[a.length-1].w-a[0].w;
  return '<svg viewBox="0 0 300 50" width="100%" height="60" role="img" aria-label="'+esc(t('lweight'))+'" style="margin-top:8px"><polyline fill="none" stroke="var(--acc)" stroke-width="2" points="'+pts+'"/></svg><p class="mut" style="margin:0">'+fmt(a[a.length-1].w,1)+' kg · '+(diff>0?'+':'')+fmt(diff,1)+' kg ('+esc(a[0].d)+' → '+esc(a[a.length-1].d)+')</p>';
}

  showDlg('<h2 style="margin-top:0">'+esc(fname(f))+'</h2><p class="mut">'+fmt(f.k)+' kcal '+esc(t('per100'))+'</p><div class="row">'
   +'<input type="number" id="dg" inputmode="numeric" min="1" max="2000" value="100" style="width:100px" aria-label="'+esc(t('grams'))+'"> g '
   +'<select id="dm" aria-label="'+esc(t('meal'))+'">'+['b','s','l','d'].map(function(s){return '<option value="'+s+'"'+(s===defSlot()?' selected':'')+'>'+esc(slotName(s))+'</option>'}).join('')+'</select></div>'
   +'<div class="row" style="margin-top:14px"><button class="pri" data-a="doadd" data-id="'+id+'">'+esc(t('addlog'))+'</button><button data-a="dclose">'+esc(t('close'))+'</button></div>');
}
var toastT;
function toast(msg){var el=$('#toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('on')},3500)}

/* ---------- shell ---------- */
function renderTabs(){$('#tabs').innerHTML=TABS.map(function(x){return '<button type="button" data-a="tab" data-id="'+x[0]+'" class="'+(x[0]===tab?'on':'')+'"'+(x[0]===tab?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[x[0]]+'</svg><span>'+esc(t(x[1]))+'</span></button>'}).join('')}
function renderFoot(){$('#foot').innerHTML='FARFURIA v'+VERSION+' · '+VDATE+' · MIT · © Alexandru-Ionuț Chiuță (Alexio) · fără frontiere · trade-free<br><a href="https://buymeacoffee.com/echo.of.the.strings" target="_blank" rel="noopener noreferrer">☕ Buy Me a Coffee</a>'}
function render(keep){
  document.documentElement.lang=LANGS[LI];
  $('#sub').textContent=t('sub');
  $('#lang').setAttribute('aria-label',t('langlbl'));$('#theme').setAttribute('aria-label',t('theme'));
  renderTabs();renderFoot();
  var f={profile:viewProfile,report:viewReport,plan:viewPlan,foods:viewFoods,log:viewLog,src:viewSrc}[tab]||viewProfile;
  try{view.innerHTML=f()}catch(e){view.innerHTML='<section class="card warn"><p style="margin:0">'+esc(t('imp_bad'))+'</p></section>'}
  if(tab==='foods')renderFoodList();
  if(keep){var n=$(keep);if(n)n.focus()}
}
function go(id){
  tab=id;store.set('tab',tab);
  try{history.pushState(null,'','#'+id)}catch(e){try{location.hash=id}catch(e2){}}
  render();window.scrollTo(0,0);
}
function doLogAdd(){var g=Math.round(+$('#lg').value);if(g>0&&g<=2000){dayLog(logDate).it.push({f:$('#lf').value,g:g,m:$('#lm').value});store.set('log',LOG);render('#lg')}}
function doWeightSave(){
  var v=Number($('#wv').value);
  if(!(v>=25&&v<=300))return;
  WT=WT.filter(function(x){return x.d!==logDate});WT.push({d:logDate,w:v});WT.sort(function(x,y){return x.d<y.d?-1:1});
  store.set('weights',WT);
  if(WT[WT.length-1].d===logDate){P.w=v;saveP()}
  render();toast(t('wsaved'));
}

/* ---------- events ---------- */
var pendingImport=null;
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.getAttribute('data-a'),id=el.getAttribute('data-id');
  if(a==='src'||a==='tab')e.preventDefault();
  if(a==='tab')go(id);
  else if(a==='src'){go('src');var n=document.getElementById('src-'+id);if(n)n.scrollIntoView()}
  else if(a==='day'){planDay=+id;render()}
  else if(a==='regen'){seed=seed>=999999?1:seed+1;store.set('seed',seed);render()}
  else if(a==='shop')openShop();
  else if(a==='print')window.print();
  else if(a==='addfood')openAdd(id);
  else if(a==='dclose'){pendingImport=null;closeDlg()}
  else if(a==='doadd'){var g=Math.round(+$('#dg').value);if(g>0&&g<=2000&&FM[id]){dayLog(logDate).it.push({f:id,g:g,m:$('#dm').value});store.set('log',LOG);toast(t('addlog'))}closeDlg();if(tab==='log')render()}
  else if(a==='logadd')doLogAdd();
  else if(a==='logdel'){dayLog(logDate).it.splice(+id,1);store.set('log',LOG);render()}
  else if(a==='wplus'){dayLog(logDate).w=Math.min(50,dayLog(logDate).w+1);store.set('log',LOG);render()}
  else if(a==='wminus'){var dl=dayLog(logDate);dl.w=Math.max(0,dl.w-1);store.set('log',LOG);render()}
  else if(a==='wsave')doWeightSave();
  else if(a==='export'){
    var blob=new Blob([JSON.stringify({app:'farfuria',v:1,profile:P,log:LOG,weights:WT},null,1)],{type:'application/json'});
    var u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='farfuria-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);
  }
  else if(a==='import')$('#ifile').click();
  else if(a==='doimport'){
    if(pendingImport){P=pendingImport.p;LOG=pendingImport.l;WT=pendingImport.w;saveP();store.set('log',LOG);store.set('weights',WT);pendingImport=null;closeDlg();render();toast(t('imp_ok'))}
  }
});
view.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='fq'){renderFoodList();return}
  var k=el.getAttribute('data-k');
  if(k&&el.type==='number'){
    if(el.value==='')P[k]='';else{var n=Number(el.value);P[k]=isFinite(n)?n:''}
    saveP();var pv=$('#pv');if(pv)pv.innerHTML=liveHTML();
  }
});
view.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(e.target.id==='lg'){e.preventDefault();doLogAdd()}
  else if(e.target.id==='wv'){e.preventDefault();doWeightSave()}
});
view.addEventListener('change',function(e){
  var el=e.target,k=el.getAttribute('data-k'),arr=el.getAttribute('data-arr');
  if(el.id==='fg'){renderFoodList();return}
  if(el.id==='ldate'){if(DATE_RE.test(el.value)&&el.value<=today()){logDate=el.value;render('#ldate')}return}
  if(el.id==='ifile'){
    var file=el.files&&el.files[0];if(!file)return;
    if(file.size>5000000){toast(t('imp_bad'));el.value='';return}
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var o=JSON.parse(fr.result);
        if(!o||typeof o!=='object'||Array.isArray(o)||o.app!=='farfuria')throw new Error('bad');
        pendingImport={p:cleanProfile(o.profile),l:cleanLog(o.log),w:cleanWeights(o.weights)};
        showDlg('<h2 style="margin-top:0">'+esc(t('limport'))+'</h2><p>'+esc(t('imp_q'))+'</p><div class="row"><button class="pri" data-a="doimport">'+esc(t('limport'))+'</button><button data-a="dclose">'+esc(t('cancel'))+'</button></div>');
      }catch(x){pendingImport=null;toast(t('imp_bad'))}
      el.value='';
    };
    fr.onerror=function(){toast(t('imp_bad'))};
    fr.readAsText(file);return;
  }
  if(arr){
    var i=P[arr].indexOf(el.value);
    if(el.checked&&i<0)P[arr].push(el.value);
    if(!el.checked&&i>=0)P[arr].splice(i,1);
    saveP();
    if(arr==='cond')render('[data-arr="cond"][value="'+el.value+'"]');
    else{var pv2=$('#pv');if(pv2)pv2.innerHTML=liveHTML()}
    return;
  }
  if(k){
    if(el.type==='checkbox'){P[k]=el.checked}
    else if(el.tagName==='SELECT'){P[k]=(k==='act'||k==='pace'||k==='meals')?+el.value:el.value}
    else return;
    if(k==='sex'&&P.sex==='m')P.cond=P.cond.filter(function(x){return x!=='preg'});
    saveP();
    if(k==='goal'||k==='sex')render('[data-k="'+k+'"]');
  }
});
dlg.addEventListener('click',function(e){if(e.target===dlg){pendingImport=null;closeDlg()}});
dlg.addEventListener('close',function(){pendingImport=null});
window.addEventListener('hashchange',function(){
  var h=(location.hash||'').replace('#','');
  if(TABIDS.indexOf(h)>=0&&h!==tab){tab=h;store.set('tab',tab);render();window.scrollTo(0,0)}
});
(function(){
  var sel=$('#lang');sel.innerHTML=LN.map(function(n,i){return '<option value="'+i+'">'+n+'</option>'}).join('');sel.value=String(LI);
  sel.addEventListener('change',function(){LI=+sel.value;store.set('lang',LI);closeDlg();render()});
  var th=store.get('theme',null);if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);
  $('#theme').addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var dark=cur?cur==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
    var nx=dark?'light':'dark';document.documentElement.setAttribute('data-theme',nx);store.set('theme',nx);
  });
})();
render();
})();
</script>
</body>
</html>
